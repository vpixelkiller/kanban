<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Kanban Board</h1>
        <p>Doble clic para editar, arrastra tarjetas entre columnas</p>
      </div>
      <div class="status-panel">
        <div id="loading" class="loading">Cargando tareas...</div>
        <div id="error" class="error" style="display: none"></div>
      </div>
      <div class="board-wrapper">
        <div class="kanban-board" id="kanbanBoard"></div>
      </div>
    </div>
    <div id="taskModal" class="modal-overlay" style="display: none">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Nueva tarea</h2>
          <button id="modalCloseBtn" class="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <label for="modalDescription">Descripción</label>
          <textarea id="modalDescription" placeholder="Describe la tarea..."></textarea>
          <div class="modal-fields">
            <div>
              <label for="modalStatus">Estado</label>
              <select id="modalStatus">
                <option value="Some day">Some day</option>
                <option value="This week">This week</option>
                <option value="Tomorrow">Tomorrow</option>
                <option value="Today">Today</option>
                <option value="In progress">In progress</option>
                <option value="Done">Done</option>
                <option value="deleted">Deleted</option>
              </select>
            </div>
            <div>
              <label for="modalPriority">Prioridad</label>
              <select id="modalPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="top">Top</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="modalCancelBtn" class="modal-secondary">Cancelar</button>
          <button id="modalCreateBtn" class="modal-primary">Crear tarea</button>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
