<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Kanban Board</h1>
        <p>Doble clic para editar, arrastra tarjetas entre columnas</p>
      </div>
      <div class="status-panel">
        <div id="loading" class="loading">Cargando tareas...</div>
        <div id="error" class="error" style="display: none"></div>
      </div>
      <div class="new-task-panel">
        <textarea
          id="newDescription"
          placeholder="Escribe la descripción de la tarea..."
        ></textarea>
        <div class="new-task-fields">
          <select id="newStatus">
            <option value="Some day">Some day</option>
            <option value="This week">This week</option>
            <option value="Tomorrow">Tomorrow</option>
            <option value="Today">Today</option>
            <option value="In progress">In progress</option>
            <option value="Done">Done</option>
            <option value="deleted">Deleted</option>
          </select>
          <select id="newPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="top">Top</option>
          </select>
          <button id="createTaskBtn">➕ Crear</button>
        </div>
      </div>
      <div class="board-wrapper">
        <div class="kanban-board" id="kanbanBoard"></div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
